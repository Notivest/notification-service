spring.application.name=notification-service
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSX,UTC} %-5level service=${spring.application.name:notification-service} traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-} userId=%X{userId:-} [%thread] %logger{36} - %msg%n
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.newrelic.api-key=${NEW_RELIC_API_KEY:}
management.newrelic.account-id=${NEW_RELIC_ACCOUNT_ID:}
management.newrelic.uri=${NEW_RELIC_METRICS_URI:https://insights-collector.newrelic.com}
management.newrelic.step=1m

# Datasource (PostgreSQL by default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_service}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:notification_service}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:notification_service}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (runs against the same datasource)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audience=${JWT_AUDIENCE:}
# Fallback email used only when Spring profile 'default-email' is active
notification.security.default-email=${JWT_DEFAULT_EMAIL:default-profile@notivest.local}

portfolio.service.base-url=${PORTFOLIO_SERVICE_BASE_URL:http://portfolio-service:8080}
portfolio.service.connect-timeout=${PORTFOLIO_SERVICE_CONNECT_TIMEOUT:PT0.5S}
portfolio.service.read-timeout=${PORTFOLIO_SERVICE_READ_TIMEOUT:PT3S}
portfolio.service.auth.domain=${PORTFOLIO_SERVICE_AUTH0_DOMAIN}
portfolio.service.auth.client-id=${PORTFOLIO_SERVICE_AUTH0_CLIENT_ID}
portfolio.service.auth.client-secret=${PORTFOLIO_SERVICE_AUTH0_CLIENT_SECRET}
portfolio.service.auth.audience=${PORTFOLIO_SERVICE_AUTH0_AUDIENCE}
portfolio.service.auth.scope=${PORTFOLIO_SERVICE_AUTH0_SCOPE}
portfolio.service.auth.connect-timeout=${PORTFOLIO_SERVICE_AUTH_CONNECT_TIMEOUT}
portfolio.service.auth.read-timeout=${PORTFOLIO_SERVICE_AUTH_READ_TIMEOUT}
portfolio.service.auth.clock-skew=${PORTFOLIO_SERVICE_AUTH_CLOCK_SKEW}


# Deduplication
dedup.window-minutes=${DEDUP_WINDOW_MINUTES:5}

# Email
notification.email.from=${NOTIFICATION_EMAIL_FROM:${SMTP_FROM:notifications@example.com}}
spring.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:localhost}}
spring.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:1025}}
spring.mail.username=${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:${SENDGRID_API_KEY:}}}
spring.mail.properties.mail.debug=${SPRING_MAIL_PROPERTIES_MAIL_DEBUG:false}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${SMTP_AUTH:false}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${SMTP_STARTTLS:false}}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:${SMTP_STARTTLS_REQUIRED:false}}

# Email worker
notification.email.worker.enabled=${NOTIFICATION_EMAIL_WORKER_ENABLED:true}
notification.email.worker.batch-size=${NOTIFICATION_EMAIL_WORKER_BATCH_SIZE:25}
notification.email.worker.fixed-delay-ms=${NOTIFICATION_EMAIL_WORKER_DELAY_MS:5000}
